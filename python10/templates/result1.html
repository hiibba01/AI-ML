<html>
    <h2>
        Final Results
    </h2>

    <body>
        <table border = "2">
            {% for key, value in results.items() %}
                <tr>
                    {# Thois is comment in jinja2 #}
                    <td>{{ key }}</td>
                    <td>{{ value }}</td>
                </tr>
            {% endfor %}  
            <!-- we are closing the for loop here by writing end for -->
        </table>
    </body>
</html>
